<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMUD MOTEL COMMAND CENTER — 30-Room Hotel Management</title>
    <meta name="description" content="Manage every room, reservation, guest, payment, and operational task from one centralized system.">
    <link rel="manifest" href="data:application/json,{}">
    <style>
        :root {
            --bg: #07100D;
            --panel: #0E1714;
            --primary: #F2F5F3;
            --muted: #89958F;
            --accent: #B8FF3D;
            --warning: #F5C84C;
            --critical: #FF5C5C;
            --info: #5CA8FF;
            --border: #1a2a22;
            --card: #111d18;
            --hover: #16251f;
            --radius: 8px;
            --radius-sm: 5px;
            --transition: 0.18s ease;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 14px;
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--primary);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: #1e3028;
            border-radius: 20px;
        }
        a {
            color: var(--info);
            text-decoration: none;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.55em 1.1em;
            transition: var(--transition);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.4em;
            white-space: nowrap;
        }
        button:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: var(--accent);
            color: #000;
            font-weight: 600;
        }
        .btn-primary:hover {
            filter: brightness(1.1);
        }
        .btn-secondary {
            background: #1a2a22;
            color: var(--primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--hover);
        }
        .btn-danger {
            background: var(--critical);
            color: #fff;
            font-weight: 600;
        }
        .btn-sm {
            padding: 0.35em 0.7em;
            font-size: 0.82rem;
            border-radius: 4px;
        }
        .btn-xs {
            padding: 0.2em 0.5em;
            font-size: 0.72rem;
            border-radius: 3px;
        }
        input,
        select,
        textarea {
            font-family: inherit;
            font-size: 0.93rem;
            background: #0a1510;
            border: 1px solid var(--border);
            color: var(--primary);
            padding: 0.55em 0.75em;
            border-radius: var(--radius-sm);
            width: 100%;
            transition: var(--transition);
            outline: none;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(184, 255, 61, 0.08);
        }
        label {
            font-size: 0.82rem;
            color: var(--muted);
            display: block;
            margin-bottom: 0.25em;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .badge {
            display: inline-block;
            padding: 0.2em 0.55em;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .badge-green {
            background: #0f3d1f;
            color: #6ee889;
        }
        .badge-blue {
            background: #0f2a3d;
            color: #6eb8ee;
        }
        .badge-lime {
            background: #1f3d0f;
            color: #b8ff3d;
        }
        .badge-yellow {
            background: #3d300f;
            color: #f5c84c;
        }
        .badge-red {
            background: #3d0f0f;
            color: #ff5c5c;
        }
        .badge-gray {
            background: #1a1f1c;
            color: #89958f;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.1rem;
        }
        .card-header {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 0.5em;
        }
        .card-value {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        /* Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 240px;
            min-width: 240px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.25s ease;
        }
        .sidebar-logo {
            padding: 1.2rem 1.1rem;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 0.5em;
        }
        .sidebar-logo .dot {
            width: 9px;
            height: 9px;
            background: var(--accent);
            border-radius: 50%;
            flex-shrink: 0;
        }
        .sidebar-nav {
            flex: 1;
            padding: 0.5rem 0;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.6em;
            padding: 0.6em 1.1rem;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.88rem;
            transition: var(--transition);
            border-left: 3px solid transparent;
            letter-spacing: 0.02em;
        }
        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            color: var(--primary);
            background: var(--hover);
            border-left-color: var(--accent);
        }
        .sidebar-nav a .nav-icon {
            width: 18px;
            text-align: center;
            flex-shrink: 0;
            font-size: 0.9rem;
        }
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem;
            max-width: 100%;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
        }
        .top-bar h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .top-bar .user-badge {
            display: flex;
            align-items: center;
            gap: 0.5em;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 0.4em 0.9em;
            border-radius: 20px;
            font-size: 0.82rem;
        }
        .search-box {
            position: relative;
            max-width: 320px;
        }
        .search-box input {
            padding-left: 2.2em;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .search-box .search-icon {
            position: absolute;
            left: 0.7em;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.9rem;
        }
        /* Dashboard cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.7rem;
            margin-bottom: 1.2rem;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.9rem 1rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .stat-card:hover {
            border-color: var(--accent);
        }
        .stat-card .stat-label {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.2em;
        }
        .stat-card .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }
        /* Room Grid */
        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.5rem;
        }
        .room-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        .room-card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .room-card .room-num {
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }
        .room-card .room-status {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.2em;
        }
        .room-card .room-guest {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 0.15em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .room-card .room-rate {
            font-size: 0.68rem;
            color: var(--muted);
            margin-top: 0.1em;
        }
        .room-card.status-available {
            border-color: #1a4a2a;
            background: #0d1f14;
        }
        .room-card.status-occupied {
            border-color: #3a4a1a;
            background: #1a1f0d;
        }
        .room-card.status-reserved {
            border-color: #1a3a4a;
            background: #0d1a1f;
        }
        .room-card.status-cleaning {
            border-color: #4a3a1a;
            background: #1f1a0d;
        }
        .room-card.status-dirty {
            border-color: #4a2a1a;
            background: #1f150d;
        }
        .room-card.status-maintenance {
            border-color: #4a1a1a;
            background: #1f0d0d;
        }
        .room-card.status-outofservice {
            border-color: #2a2a2a;
            background: #151515;
            opacity: 0.7;
        }
        /* Tables */
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th {
            text-align: left;
            padding: 0.6em 0.7em;
            color: var(--muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 0.5em 0.7em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            white-space: nowrap;
        }
        tr:hover td {
            background: var(--hover);
        }
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.4rem;
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
        }
        .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 1.2rem;
            flex-wrap: wrap;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
        }
        .form-row.span-3 {
            grid-template-columns: 1fr 1fr 1fr;
        }
        .form-group {
            margin-bottom: 0.7rem;
        }
        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .tab {
            padding: 0.5em 1em;
            cursor: pointer;
            color: var(--muted);
            border-bottom: 2px solid transparent;
            font-size: 0.85rem;
            transition: var(--transition);
            white-space: nowrap;
        }
        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .tab:hover {
            color: var(--primary);
        }
        /* Alerts */
        .alert {
            padding: 0.6em 1em;
            border-radius: var(--radius-sm);
            margin-bottom: 0.5rem;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 0.5em;
        }
        .alert-critical {
            background: #3d0f0f;
            border: 1px solid #5c2020;
            color: #ff5c5c;
        }
        .alert-warning {
            background: #3d300f;
            border: 1px solid #5c4a20;
            color: #f5c84c;
        }
        .alert-info {
            background: #0f2a3d;
            border: 1px solid #20405c;
            color: #5ca8ff;
        }
        /* Mobile */
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 1.5rem;
            padding: 0.3em;
            cursor: pointer;
        }
        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                transform: translateX(-100%);
                width: 260px;
                z-index: 300;
                box-shadow: 4px 0 30px rgba(0, 0, 0, 0.6);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .mobile-toggle {
                display: block;
            }
            .main-content {
                padding: 0.8rem;
            }
            .stats-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 0.4rem;
            }
            .room-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 0.35rem;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-row.span-3 {
                grid-template-columns: 1fr 1fr;
            }
            .modal {
                max-width: 95vw;
                padding: 1rem;
            }
            .top-bar h1 {
                font-size: 1.1rem;
            }
        }
        @media (max-width: 500px) {
            .room-grid {
                grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            }
            .room-card {
                padding: 0.4rem;
                min-height: 60px;
            }
            .room-card .room-num {
                font-size: 0.78rem;
            }
            .room-card .room-status {
                font-size: 0.6rem;
            }
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .stat-card .stat-value {
                font-size: 1.1rem;
            }
            .form-row.span-3 {
                grid-template-columns: 1fr;
            }
        }
        .hidden {
            display: none !important;
        }
        .text-muted {
            color: var(--muted);
            font-size: 0.8rem;
        }
        .text-accent {
            color: var(--accent);
        }
        .text-critical {
            color: var(--critical);
        }
        .text-warning {
            color: var(--warning);
        }
        .mb-1 {
            margin-bottom: 0.5rem;
        }
        .mb-2 {
            margin-bottom: 1rem;
        }
        .mt-1 {
            margin-top: 0.5rem;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a3a1a;
            border: 1px solid #3a5a3a;
            color: #b8ff3d;
            padding: 0.7em 1.2em;
            border-radius: var(--radius);
            z-index: 999;
            font-weight: 500;
            animation: toastIn 0.3s ease;
            font-size: 0.88rem;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .calendar-day {
            display: inline-block;
            width: 36px;
            height: 36px;
            line-height: 36px;
            text-align: center;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
            margin: 2px;
        }
        .calendar-day:hover {
            background: var(--hover);
        }
        .calendar-day.selected {
            background: var(--accent);
            color: #000;
            font-weight: 700;
        }
        .calendar-day.occupied-range {
            background: #2a1a1a;
            color: #ff5c5c;
            cursor: not-allowed;
        }
        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <span class="dot"></span> AMUD MOTEL
            </div>

                    </div>
                    <div class="user-badge">
                        <span>👤</span> <span id="currentRole">Manager</span>
                    </div>
                </div>
            </div>
            <div id="viewContainer">
                <!-- Dynamic content rendered here -->
            </div>
        </main>
    </div>
    <!-- Toast container -->
    <div id="toastContainer"></div>
    <!-- Modal container -->
    <div id="modalContainer"></div>

    <script>
        // ──────────────────────────────────────
        // AMUD MOTEL COMMAND CENTER — COMPLETE SYSTEM

        // ============ DATA STORE ============
        const STORAGE_KEY = 'amud_motel_data';
        let appData = loadData();

        function getDefaultData() {

            return {

                    { id: 'guest-demo-2', fullName: 'Demo Guest 02', phone: '+251911000102', email: 'demo2@example.com',
                        country: 'Ethiopia', city: 'Dire Dawa', idType: 'Passport', idNumber: 'DEMO-002',
                    notes: 'Demo data', totalNights: 3, totalSpending: 3600 },
                    { id: 'guest-demo-3', fullName: 'Demo Guest 03', phone: '+251911000103', email: 'demo3@example.com',
                        country: 'Ethiopia', city: 'Bahir Dar', idType: 'National ID', idNumber: 'DEMO-003',

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) {}
            const d = getDefaultData();
            saveData(d);
            return d;
        }

        function saveData(data) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                showToast('⚠️ Storage full. Please clear some data.', 'warning');
            }
            appData = data || appData;
        }

        function persistData() { saveData(appData); }

        function generateId(prefix) {
            const key = prefix.replace(/[^a-z]/g, '');
            if (!appData.nextIds) appData.nextIds = {};
            if (!appData.nextIds[key]) appData.nextIds[key] = 1;
            const id = `${prefix}-${appData.nextIds[key].toString().padStart(3, '0')}`;
            appData.nextIds[key]++;
            persistData();
            return id;
        }

        // ============ HELPERS ============
        function getRoomById(id) { return appData.rooms.find(r => r.id === id); }

        function getGuestById(id) { return appData.guests.find(g => g.id === id); }

        function getReservationById(id) { return appData.reservations.find(r => r.id === id); }

        function getReservationsForRoom(roomId) { return appData.reservations.filter(r => r.roomId === roomId); }

        function getActiveReservationForRoom(roomId) {
            return appData.reservations.find(r => r.roomId === roomId && ['checked_in', 'confirmed'].includes(r
                .reservationStatus));
        }

        function isRoomAvailable(roomId, checkIn, checkOut) {
            const room = getRoomById(roomId);
            if (!room || ['maintenance', 'outofservice'].includes(room.status)) return false;
            const reservations = appData.reservations.filter(r =>
                r.roomId === roomId && !['cancelled', 'checked_out', 'no_show'].includes(r.reservationStatus)
            );
            for (const res of reservations) {
                const resIn = res.checkInDate;
                const resOut = res.checkOutDate;
                if (checkIn < resOut && checkOut > resIn) return false;
            }
            return true;
        }

        function getAvailableRooms(checkIn, checkOut) {
            return appData.rooms.filter(r => isRoomAvailable(r.id, checkIn, checkOut));
        }

        function formatCurrency(amount) {
            const curr = appData.settings?.currency || 'ETB';
            return `${curr} ${Number(amount).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function todayStr() { return new Date().toISOString().split('T')[0]; }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = 'toast';
            el.style.background = type === 'warning' ? '#3d300f' : type === 'error' ? '#3d0f0f' : '#1a3a1a';
            el.style.borderColor = type === 'warning' ? '#5c4a20' : type === 'error' ? '#5c2020' : '#3a5a3a';
            el.style.color = type === 'warning' ? '#f5c84c' : type === 'error' ? '#ff5c5c' : '#b8ff3d';
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => { el.remove(); }, 3000);
        }

        function openModal(title, contentHTML, onSave, saveLabel = 'Save') {
            const container = document.getElementById('modalContainer');
            container.innerHTML = `
            <div class="modal-overlay" id="modalOverlay">
              <div class="modal">
                <div class="flex-between mb-2"><h2>${title}</h2><button class="btn-sm btn-secondary" id="modalClose">✕</button></div>
                <div id="modalBody">${contentHTML}</div>
                <div class="modal-actions">
                  <button class="btn-secondary" id="modalCancel">Cancel</button>
                  ${onSave ? `<button class="btn-primary" id="modalSave">${saveLabel}</button>` : ''}
                </div>
              </div>
            </div>`;
            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('modalCancel').addEventListener('click', closeModal);
            document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this)
                    closeModal(); });
            if (onSave) {
                document.getElementById('modalSave').addEventListener('click', () => {
                    const result = onSave();
                    if (result !== false) closeModal();
                });
            }
            return document.getElementById('modalBody');
        }

        function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

        // ============ NAVIGATION ============
        let currentView = 'dashboard';

        function navigateTo(view) {
            currentView = view;
            document.querySelectorAll('#sidebarNav a').forEach(a => a.classList.remove('active'));
            const link = document.querySelector(`#sidebarNav a[data-view="${view}"]`);
            if (link) link.classList.add('active');
            document.getElementById('viewTitle').textContent = view.charAt(0).toUpperCase() + view.slice(1).replace(
                /([A-Z])/g, ' $1');
            renderView(view);
            document.getElementById('sidebar').classList.remove('open');
        }

        function renderView(view) {
            const container = document.getElementById('viewContainer');
            switch (view) {
                case 'dashboard':
                    container.innerHTML = renderDashboard();
                    break;
                case 'rooms':
                    container.innerHTML = renderRoomsView();
                    break;
                case 'reservations':
                    container.innerHTML = renderReservationsView();
                    break;
                case 'calendar':
                    container.innerHTML = renderCalendarView();
                    break;
                case 'guests':
                    container.innerHTML = renderGuestsView();
                    break;
                case 'checkin':
                    container.innerHTML = renderCheckInOutView();
                    break;
                case 'payments':
                    container.innerHTML = renderPaymentsView();
                    break;
                case 'housekeeping':
                    container.innerHTML = renderHousekeepingView();
                    break;
                case 'maintenance':
                    container.innerHTML = renderMaintenanceView();
                    break;
                case 'inventory':
                    container.innerHTML = renderInventoryView();
                    break;
                case 'expenses':
                    container.innerHTML = renderExpensesView();
                    break;
                case 'revenue':
                    container.innerHTML = renderRevenueView();
                    break;
                case 'reports':
                    container.innerHTML = renderReportsView();
                    break;
                case 'complaints':
                    container.innerHTML = renderComplaintsView();
                    break;
                case 'staff':
                    container.innerHTML = renderStaffView();
                    break;
                case 'settings':
                    container.innerHTML = renderSettingsView();
                    break;
                default:
                    container.innerHTML = renderDashboard();
            }
            attachViewEvents(view);
        }

        function attachViewEvents(view) {
            // Global search
            const searchInput = document.getElementById('globalSearch');
            if (searchInput && !searchInput._bound) {
                searchInput._bound = true;
                searchInput.addEventListener('input', function() {
                    const q = this.value.toLowerCase().trim();
                    if (q.length < 2 && q.length > 0) return;
                    if (q.length >= 2 || q.length === 0) {
                        if (currentView === 'guests') renderGuestsView(q);
                        if (currentView === 'reservations') renderReservationsView(q);
                        if (currentView === 'rooms') renderRoomsView(q);
                    }
                });
            }
        }

        // ============ DASHBOARD ============
        function renderDashboard() {
            const today = todayStr();
            const occupied = appData.rooms.filter(r => r.status === 'occupied').length;
            const available = appData.rooms.filter(r => r.status === 'available').length;
            const reserved = appData.rooms.filter(r => r.status === 'reserved').length;
            const cleaning = appData.rooms.filter(r => r.status === 'cleaning').length;
            const maintenance = appData.rooms.filter(r => r.status === 'maintenance').length;
            const todayCheckIns = appData.reservations.filter(r => r.checkInDate === today && r.reservationStatus ===
                'confirmed').length;
            const todayCheckOuts = appData.reservations.filter(r => r.checkOutDate === today && r.reservationStatus ===
                'checked_in').length;
            const todayRevenue = appData.payments.filter(p => p.date === today).reduce((s, p) => s + p.amount, 0);
            const occupancyRate = appData.rooms.length > 0 ? Math.round((occupied / appData.rooms.length) * 100) : 0;
            const alerts = [];
            appData.rooms.forEach(r => { if (r.status === 'maintenance') alerts.push(
                    `🔴 Room ${r.roomNumber} under maintenance`); });
            appData.reservations.filter(r => r.checkOutDate === today && r.reservationStatus === 'checked_in').forEach(r =>
                alerts.push(`🟡 Room ${getRoomById(r.roomId)?.roomNumber || '?'} checkout today`));
            appData.rooms.filter(r => r.status === 'dirty').forEach(r => alerts.push(
                `🟡 Room ${r.roomNumber} cleaning required`));
            appData.inventoryItems.filter(i => i.status === 'critical' || i.status === 'low').forEach(i => alerts.push(
                `🟡 ${i.item} below reorder level (${i.currentQty} ${i.unit})`));
            if (todayCheckIns > 0) alerts.push(`🔵 ${todayCheckIns} arrivals today`);

            let html = `
            <div class="stats-grid">
              <div class="stat-card" onclick="navigateTo('rooms')"><div class="stat-label">Total Rooms</div><div class="stat-value">30</div></div>
              <div class="stat-card" onclick="navigateTo('rooms')"><div class="stat-label">Occupied</div><div class="stat-value" style="color:#b8ff3d">${occupied}</div></div>
              <div class="stat-card" onclick="navigateTo('rooms')"><div class="stat-label">Available</div><div class="stat-value" style="color:#6ee889">${available}</div></div>
              <div class="stat-card" onclick="navigateTo('rooms')"><div class="stat-label">Reserved</div><div class="stat-value" style="color:#6eb8ee">${reserved}</div></div>
              <div class="stat-card" onclick="navigateTo('housekeeping')"><div class="stat-label">Cleaning</div><div class="stat-value" style="color:#f5c84c">${cleaning}</div></div>
              <div class="stat-card" onclick="navigateTo('maintenance')"><div class="stat-label">Maintenance</div><div class="stat-value" style="color:#ff5c5c">${maintenance}</div></div>
              <div class="stat-card"><div class="stat-label">Today's Check-Ins</div><div class="stat-value">${todayCheckIns}</div></div>
              <div class="stat-card"><div class="stat-label">Today's Check-Outs</div><div class="stat-value">${todayCheckOuts}</div></div>
              <div class="stat-card"><div class="stat-label">Today's Revenue</div><div class="stat-value">${formatCurrency(todayRevenue)}</div></div>
              <div class="stat-card"><div class="stat-label">Occupancy Rate</div><div class="stat-value">${occupancyRate}%</div></div>
            </div>`;
            if (alerts.length > 0) {
                html += `<div class="mb-2"><strong>⚠️ Alerts</strong></div>`;
                alerts.forEach(a => {
                    const cls = a.startsWith('🔴') ? 'alert-critical' : a.startsWith('🟡') ? 'alert-warning' :
                        'alert-info';
                    html += `<div class="alert ${cls}">${a}</div>`;
                });
            }
            html += `<div class="card mt-1"><div class="card-header">Quick Room Overview</div>
            <div class="room-grid">${appData.rooms.map(r => renderRoomCard(r)).join('')}</div></div>`;
            return html;
        }

        function renderRoomCard(room) {
            const guest = room.currentGuestId ? getGuestById(room.currentGuestId) : null;
            const statusClass = `status-${room.status}`;
            return `
            <div class="room-card ${statusClass}" onclick="openRoomDetail('${room.id}')">
              <div class="room-num">ROOM ${room.roomNumber}</div>
              <div class="room-status">${room.status.toUpperCase()}</div>
              ${guest ? `<div class="room-guest">${guest.fullName}</div>` : ''}
              <div class="room-rate">${formatCurrency(room.currentRate)}</div>
            </div>`;
        }

        function openRoomDetail(roomId) {
            const room = getRoomById(roomId);
            if (!room) return;
            const guest = room.currentGuestId ? getGuestById(room.currentGuestId) : null;
            const activeRes = getActiveReservationForRoom(roomId);
            const content = `
            <div class="form-row"><div class="form-group"><label>Room</label><p><strong>ROOM ${room.roomNumber}</strong></p></div>
            <div class="form-group"><label>Type</label><p>${room.roomType} | ${room.bedType} | Capacity: ${room.capacity}</p></div></div>
            <div class="form-row"><div class="form-group"><label>Status</label><p><span class="badge badge-${room.status==='available'?'green':room.status==='occupied'?'lime':room.status==='reserved'?'blue':room.status==='cleaning'?'yellow':room.status==='maintenance'?'red':'gray'}">${room.status.toUpperCase()}</span></p></div>
            <div class="form-group"><label>Rate</label><p>${formatCurrency(room.currentRate)} / night</p></div></div>
            ${guest ? `<div class="form-row"><div class="form-group"><label>Current Guest</label><p>${guest.fullName} (${guest.phone})</p></div>
            <div class="form-group"><label>Stay</label><p>${formatDate(room.checkInDate)} → ${formatDate(room.checkOutDate)}</p></div></div>` : '<p class="text-muted">No guest currently assigned.</p>'}
            ${activeRes ? `<div class="form-group"><label>Reservation</label><p>${activeRes.id} | ${activeRes.reservationStatus.toUpperCase()} | Balance: ${formatCurrency(activeRes.balance)}</p></div>` : ''}
            <div class="form-group"><label>Amenities</label><p>${(room.amenities||[]).join(', ') || 'None'}</p></div>
            <div class="flex-between mt-1">
              ${room.status==='reserved'||room.status==='available'?`<button class="btn-primary btn-sm" onclick="checkInRoom('${room.id}')">CHECK IN</button>`:''}
              ${room.status==='occupied'?`<button class="btn-danger btn-sm" onclick="checkOutRoom('${room.id}')">CHECK OUT</button>`:''}
              ${room.status==='available'?`<button class="btn-secondary btn-sm" onclick="reserveRoom('${room.id}')">RESERVE</button>`:''}
              <button class="btn-secondary btn-sm" onclick="changeRoomStatus('${room.id}')">CHANGE STATUS</button>
              <button class="btn-secondary btn-sm" onclick="reportMaintenance('${room.id}')">REPORT MAINTENANCE</button>
            </div>`;
            openModal(`Room ${room.roomNumber} Details`, content, null);
            window._roomDetailRoomId = roomId;
        }

        function changeRoomStatus(roomId) {
            const room = getRoomById(roomId);
            if (!room) return;
            const statuses = ['available', 'reserved', 'occupied', 'cleaning', 'dirty', 'maintenance', 'outofservice',
                'inspection'
            ];
            const content = `
            <div class="form-group"><label>Current Status</label><p><strong>${room.status.toUpperCase()}</strong></p></div>
            <div class="form-group"><label>New Status</label><select id="newRoomStatus">${statuses.map(s=>`<option value="${s}" ${s===room.status?'selected':''}>${s.toUpperCase()}</option>`).join('')}</select></div>
            <div class="form-group"><label>Notes</label><input type="text" id="statusNotes" placeholder="Optional note"></div>`;
            openModal(`Change Room ${room.roomNumber} Status`, content, () => {
                const newStatus = document.getElementById('newRoomStatus').value;
                const notes = document.getElementById('statusNotes').value;
                room.status = newStatus;
                if (notes) room.notes = (room.notes ? room.notes + '; ' : '') + notes;
                if (newStatus === 'available') { room.currentGuestId = null;
                    room.checkInDate = null;
                    room.checkOutDate = null; }
                persistData();
                showToast(`Room ${room.roomNumber} status updated to ${newStatus.toUpperCase()}.`);
                navigateTo(currentView);
            }, 'Update Status');
        }

        function reportMaintenance(roomId) {
            const room = getRoomById(roomId);
            if (!room) return;
            const content = `

                const checkOutDate = document.getElementById('checkoutDate').value;

                const deposit = parseInt(document.getElementById('checkinDeposit').value) || 0;

                        reservation.checkOutDate = checkOutDate;
                        reservation.nights = nights;
                        reservation.ratePerNight = rate;
                        reservation.totalAmount = totalAmount;
                        reservation.deposit = (reservation.deposit || 0) + deposit;
                        reservation.balance = totalAmount - reservation.deposit;
                        reservation.paymentStatus = reservation.balance <= 0 ? 'paid' : reservation.deposit > 0 ?

                    reservation = {

                        roomId,
                        checkInDate,

                        guests: 1,
                        nights,

                        receivedBy: 'Receptionist',
                        reference: 'DEP-' + reservation.id,

        // ============ CALENDAR VIEW ============
        function renderCalendarView() {
            const today = new Date();
            const month = today.getMonth();
            const year = today.getFullYear();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            let html =
                `<div class="card mb-2"><h3>${today.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h3>
            <div class="calendar-header"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;">`;
            for (let i = 0; i < firstDay; i++) html += '<div></div>';
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr =
                    `${year}-${(month+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
                const isToday = dateStr === todayStr();
                const hasActivity = appData.reservations.some(r => r.checkInDate === dateStr || r.checkOutDate ===
                    dateStr);
                html +=
                    `<div class="calendar-day${isToday?' selected':''}" style="${hasActivity?'font-weight:700;color:var(--accent)':''}" onclick="showDayReservations('${dateStr}')">${d}</div>`;
            }
            html += `</div></div>
            <div class="card"><div class="card-header">Room Calendar — Next 7 Days</div><div class="table-wrap"><table><thead><tr><th>Room</th>${Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return`<th>${d.toLocaleDateString('en-US',{weekday:'short',day:'numeric'})}</th>`}).join('')}</tr></thead><tbody>`;
            appData.rooms.forEach(room => {
                html += `<tr><td><strong>ROOM ${room.roomNumber}</strong></td>`;
                for (let i = 0; i < 7; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() + i);
                    const ds = d.toISOString().split('T')[0];
                    const res = appData.reservations.find(r => r.roomId === room.id && r.checkInDate <= ds && r
                        .checkOutDate > ds && !['cancelled', 'no_show'].includes(r.reservationStatus));
                    const bg = res ? (res.reservationStatus === 'checked_in' ? '#1a3a1a' : '#1a2a3a') : 'transparent';
                    const label = res ? (res.reservationStatus === 'checked_in' ? 'OCC' : 'RES') : '';
                    html +=
                        `<td style="background:${bg};text-align:center;font-size:0.7rem;padding:4px;">${label}</td>`;
                }
                html += `</tr>`;
            });
            html += `</tbody></table></div></div>`;
            return html;
        }

        function walkInCheckIn() {
            const avail = getAvailableRooms(todayStr(), new Date(Date.now() + 86400000 * 7).toISOString().split('T')[0]);
            const content = `
            <div class="form-group"><label>Guest</label><select id="walkinGuest"><option value="">Select</option>${appData.guests.map(g=>`<option value="${g.id}">${g.fullName}</option>`).join('')}</select></div>
            <div class="form-group"><label>Available Rooms</label><select id="walkinRoom">${avail.map(r=>`<option value="${r.id}">ROOM ${r.roomNumber} — ${r.roomType} (${formatCurrency(r.currentRate)})</option>`).join('')}</select></div>
            <div class="form-row"><div class="form-group"><label>Check-Out Date</label><input type="date" id="walkinCheckOut" value="${new Date(Date.now()+86400000*2).toISOString().split('T')[0]}"></div>
            <div class="form-group"><label>Deposit</label><input type="number" id="walkinDeposit" value="0" step="100"></div></div>`;
            openModal('Walk-In Check-In', content, () => {
                const guestId = document.getElementById('walkinGuest').value;
                const roomId = document.getElementById('walkinRoom').value;
                const checkOut = document.getElementById('walkinCheckOut').value;
                const deposit = parseInt(document.getElementById('walkinDeposit').value) || 0;
                if (!guestId || !roomId) { showToast('Select guest and room.', 'warning'); return false; }
                const room = getRoomById(roomId);
                const nights = Math.max(1, Math.round((new Date(checkOut) - new Date()) / 86400000));
                const total = nights * (room?.currentRate || 1200);
                const res = {
                    id: generateId('res'),
                    guestId,
                    roomId,
                    checkInDate: todayStr(),
                    checkInTime: new Date().toTimeString().slice(0, 5),
                    checkOutDate: checkOut,
                    guests: 1,
                    nights,
                    ratePerNight: room?.currentRate || 1200,
                    discount: 0,
                    tax: 0,
                    totalAmount: total,
                    deposit,
                    balance: total - deposit,
                    paymentStatus: deposit >= total ? 'paid' : deposit > 0 ? 'partial' : 'unpaid',
                    reservationStatus: 'checked_in',
                    notes: 'Walk-in',
                };
                appData.reservations.push(res);
                if (deposit > 0) {
                    appData.payments.push({
                        id: generateId('pay'),
                        guestId,
                        reservationId: res.id,
                        roomId,
                        amount: deposit,
                        currency: appData.settings.currency,
                        method: 'Cash',
                        date: todayStr(),
                        time: new Date().toTimeString().slice(0, 5),
                        receivedBy: 'Receptionist',
                        reference: 'WALK-' + res.id,
                        notes: 'Walk-in deposit',
                    });
                }
                if (room) { room.status = 'occupied';
                    room.currentGuestId = guestId;
                    room.checkInDate = todayStr();
                    room.checkOutDate = checkOut; }
                persistData();
                showToast('Walk-in guest checked in!');
                navigateTo('checkin');
            }, 'Check In');
        }

        function recordPayment() {
            const content = `
            <div class="form-group"><label>Reservation</label><select id="payResId"><option value="">Select</option>${appData.reservations.filter(r=>['checked_in','confirmed'].includes(r.reservationStatus)).map(r=>`<option value="${r.id}">${r.id} — ${getGuestById(r.guestId)?.fullName||'?'} — Balance: ${formatCurrency(r.balance)}</option>`).join('')}</select></div>

            <div class="form-group"><label>Reference</label><input type="text" id="payRef" placeholder="Optional"></div>`;
            openModal('Record Payment', content, () => {
                const resId = document.getElementById('payResId').value;
                const amount = parseInt(document.getElementById('payAmount').value) || 0;
                const method = document.getElementById('payMethod').value;
                const ref = document.getElementById('payRef').value;
                if (!resId || amount <= 0) { showToast('Select reservation and enter amount.',
                'warning'); return false; }
                const res = getReservationById(resId);
                if (!res) return false;
                const payment = {
                    id: generateId('pay'),
                    guestId: res.guestId,
                    reservationId: resId,
                    roomId: res.roomId,
                    amount,
                    currency: appData.settings.currency,
                    method,
                    date: todayStr(),
                    time: new Date().toTimeString().slice(0, 5),
                    receivedBy: 'Receptionist',
                    reference: ref || ('PAY-' + resId),
                    notes: '',
                };
                appData.payments.push(payment);
                res.deposit = (res.deposit || 0) + amount;
                res.balance = res.totalAmount - res.deposit;
                res.paymentStatus = res.balance <= 0 ? 'paid' : res.deposit > 0 ? 'partial' : 'unpaid';
                persistData();
                showToast(`Payment of ${formatCurrency(amount)} recorded.`);
                navigateTo('payments');
            }, 'Record');
        }

            const today = todayStr();
            const todayRev = appData.payments.filter(p => p.date === today).reduce((s, p) => s + p.amount, 0);
            const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().split('T')[0];
            const weekRev = appData.payments.filter(p => p.date >= weekAgo).reduce((s, p) => s + p.amount, 0);
            const totalRev = appData.payments.reduce((s, p) => s + p.amount, 0);
            const totalExp = appData.expenses.reduce((s, e) => s + e.amount, 0);
            const netResult = totalRev - totalExp;
            let html = `<div class="stats-grid mb-2">
            <div class="stat-card"><div class="stat-label">Today's Revenue</div><div class="stat-value">${formatCurrency(todayRev)}</div></div>
            <div class="stat-card"><div class="stat-label">Weekly Revenue</div><div class="stat-value">${formatCurrency(weekRev)}</div></div>
            <div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-value">${formatCurrency(totalRev)}</div></div>
            <div class="stat-card"><div class="stat-label">Total Expenses</div><div class="stat-value" style="color:#ff5c5c">${formatCurrency(totalExp)}</div></div>
            <div class="stat-card"><div class="stat-label">Net Result</div><div class="stat-value" style="color:${netResult>=0?'#b8ff3d':'#ff5c5c'}">${formatCurrency(netResult)}</div></div></div>
            <p class="text-muted">⚠️ Revenue ≠ Profit. Net result = Total Revenue − Total Expenses.</p>`;
            return html;
        }

        // ============ REPORTS VIEW ============
        function renderReportsView() {
            const today = todayStr();
            const occupied = appData.rooms.filter(r => r.status === 'occupied').length;
            const available = appData.rooms.filter(r => r.status === 'available').length;
            const reserved = appData.rooms.filter(r => r.status === 'reserved').length;
            const cleaning = appData.rooms.filter(r => r.status === 'cleaning').length;
            const maintenance = appData.rooms.filter(r => r.status === 'maintenance').length;
            const todayCheckIns = appData.reservations.filter(r => r.checkInDate === today && r.reservationStatus ===
                'checked_in').length;
            const todayCheckOuts = appData.reservations.filter(r => r.checkOutDate === today && r.reservationStatus ===
                'checked_in').length;
            const todayRev = appData.payments.filter(p => p.date === today).reduce((s, p) => s + p.amount, 0);
            const occupancyRate = Math.round((occupied / 30) * 100);
            const totalExp = appData.expenses.filter(e => e.date === today).reduce((s, e) => s + e.amount, 0);
            let html = `<div class="card"><div class="card-header">Daily Operations Report — ${formatDate(today)}</div>
            <div class="form-row span-3 mb-1"><div><strong>Total Rooms:</strong> 30</div><div><strong>Occupied:</strong> ${occupied}</div><div><strong>Available:</strong> ${available}</div></div>
            <div class="form-row span-3 mb-1"><div><strong>Reserved:</strong> ${reserved}</div><div><strong>Cleaning:</strong> ${cleaning}</div><div><strong>Maintenance:</strong> ${maintenance}</div></div>
            <div class="form-row span-3 mb-1"><div><strong>Check-Ins:</strong> ${todayCheckIns}</div><div><strong>Check-Outs:</strong> ${todayCheckOuts}</div><div><strong>Occupancy:</strong> ${occupancyRate}%</div></div>
            <div class="form-row span-3 mb-1"><div><strong>Room Revenue:</strong> ${formatCurrency(todayRev)}</div><div><strong>Expenses:</strong> ${formatCurrency(totalExp)}</div><div><strong>Net:</strong> ${formatCurrency(todayRev-totalExp)}</div></div>
            </div>
            <button class="btn-secondary btn-sm mt-1" onclick="exportCSV()">📥 Export CSV</button>`;
            return html;
        }

        function exportCSV() {
            let csv = 'Type,ID,Date,Amount,Status\n';
            appData.payments.forEach(p => { csv +=
                    `Payment,${p.id},${p.date},${p.amount},${p.method}\n`; });
            appData.expenses.forEach(e => { csv +=
            `Expense,${e.id},${e.date},${e.amount},${e.category}\n`; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'amud_motel_report.csv';
            a.click();
            URL.revokeObjectURL(url);
            showToast('CSV exported.');
        }

        // ============ COMPLAINTS VIEW ============
        function renderComplaintsView() {
            let html =
                `<div class="flex-between mb-2"><h3>Customer Complaints</h3><button class="btn-primary btn-sm" onclick="addComplaint()">+ New Complaint</button></div>
            <div class="table-wrap"><table><thead><tr><th>ID</th><th>Guest</th><th>Room</th><th>Category</th><th>Status</th><th>Date</th></tr></thead><tbody>`;
            appData.complaints.forEach(c => {
                html +=
                    `<tr><td>${c.id}</td><td>${getGuestById(c.guestId)?.fullName||'?'}</td><td>ROOM ${getRoomById(c.roomId)?.roomNumber||'?'}</td><td>${c.category}</td><td><span class="badge badge-${c.status==='resolved'||c.status==='closed'?'green':'yellow'}">${c.status.toUpperCase()}</span></td><td>${c.date}</td></tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        function addComplaint() {
            const content = `
            <div class="form-group"><label>Guest</label><select id="compGuest">${appData.guests.map(g=>`<option value="${g.id}">${g.fullName}</option>`).join('')}</select></div>
            <div class="form-group"><label>Room</label><select id="compRoom">${appData.rooms.map(r=>`<option value="${r.id}">ROOM ${r.roomNumber}</option>`).join('')}</select></div>
            <div class="form-row"><div class="form-group"><label>Category</label><select id="compCat"><option>Cleanliness</option><option>Noise</option><option>Room</option><option>Service</option><option>Food</option><option>Payment</option><option>Internet</option><option>Maintenance</option><option>Staff</option><option>Other</option></select></div>
            <div class="form-group"><label>Priority</label><select id="compPrio"><option>Low</option><option selected>Medium</option><option>High</option></select></div></div>
            <div class="form-group"><label>Description</label><textarea id="compDesc" rows="2"></textarea></div>`;
            openModal('New Complaint', content, () => {
                const c = {
                    id: generateId('comp'),
                    guestId: document.getElementById('compGuest').value,
                    roomId: document.getElementById('compRoom').value,
                    date: todayStr(),
                    category: document.getElementById('compCat').value,
                    description: document.getElementById('compDesc').value,
                    priority: document.getElementById('compPrio').value,
                    assignedStaff: null,
                    response: '',
                    resolution: '',
                    status: 'open',
                };
                appData.complaints.push(c);
                persistData();
                showToast('Complaint recorded.');
                navigateTo('complaints');
            }, 'Submit');
        }

        // ============ STAFF VIEW ============
        function renderStaffView() {
            let html =
                `<div class="flex-between mb-2"><h3>Staff Registry</h3><button class="btn-primary btn-sm" onclick="addStaff()">+ Add Staff</button></div>
            <div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Department</th><th>Phone</th><th>Status</th><th>Shift</th></tr></thead><tbody>`;
            appData.staff.forEach(s => {
                html +=
                    `<tr><td>${s.name}</td><td>${s.role}</td><td>${s.department}</td><td>${s.phone}</td><td>${s.status}</td><td>${s.shift||'—'}</td></tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        function addStaff() {
            const content = `
            <div class="form-row"><div class="form-group"><label>Name</label><input type="text" id="staffName"></div>
            <div class="form-group"><label>Role</label><select id="staffRole"><option>Manager</option><option>Receptionist</option><option>Housekeeping</option><option>Maintenance</option><option>Cashier</option></select></div></div>
            <div class="form-row"><div class="form-group"><label>Department</label><input type="text" id="staffDept" value="General"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="staffPhone"></div></div>`;
            openModal('Add Staff', content, () => {
                const s = {
                    id: generateId('staff'),
                    name: document.getElementById('staffName').value,
                    role: document.getElementById('staffRole').value,
                    department: document.getElementById('staffDept').value,
                    phone: document.getElementById('staffPhone').value,
                    status: 'Active',
                    shift: 'Morning',
                    notes: '',
                };
                if (!s.name) { showToast('Name required.', 'warning'); return false; }
                appData.staff.push(s);
                persistData();
                showToast('Staff added.');
                navigateTo('staff');
            }, 'Add');
        }

        // ============ SETTINGS VIEW ============
        function renderSettingsView() {
            const s = appData.settings;
            let html = `<div class="card"><div class="card-header">Motel Configuration</div>
            <div class="form-row"><div class="form-group"><label>Motel Name</label><input type="text" id="setName" value="${s.motelName}"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="setPhone" value="${s.phone}"></div></div>
            <div class="form-row"><div class="form-group"><label>Email</label><input type="email" id="setEmail" value="${s.email}"></div>
            <div class="form-group"><label>Address</label><input type="text" id="setAddress" value="${s.address}"></div></div>
            <div class="form-row"><div class="form-group"><label>Currency</label><input type="text" id="setCurrency" value="${s.currency}"></div>
            <div class="form-group"><label>Tax Rate (%)</label><input type="number" id="setTaxRate" value="${s.taxRate}" step="0.1"></div></div>
            <div class="form-row"><div class="form-group"><label>Check-In Time</label><input type="time" id="setCheckIn" value="${s.checkInTime}"></div>
            <div class="form-group"><label>Check-Out Time</label><input type="time" id="setCheckOut" value="${s.checkOutTime}"></div></div>
            <button class="btn-primary mt-1" onclick="saveSettings()">Save Settings</button>
            <button class="btn-danger btn-sm mt-1" style="margin-left:0.5rem;" onclick="resetAllData()">⚠️ Reset All Data</button>
            </div>`;
            return html;
        }

        function saveSettings() {
            appData.settings.motelName = document.getElementById('setName').value;
            appData.settings.phone = document.getElementById('setPhone').value;
            appData.settings.email = document.getElementById('setEmail').value;
            appData.settings.address = document.getElementById('setAddress').value;
            appData.settings.currency = document.getElementById('setCurrency').value;
            appData.settings.taxRate = parseFloat(document.getElementById('setTaxRate').value) || 0;
            appData.settings.checkInTime = document.getElementById('setCheckIn').value;
            appData.settings.checkOutTime = document.getElementById('setCheckOut').value;
            persistData();
            showToast('Settings saved.');
        }

        function resetAllData() {
            if (confirm('⚠️ This will DELETE all data and reset to defaults. Are you sure?')) {
                if (confirm('FINAL WARNING: All reservations, guests, payments will be lost. Continue?')) {
                    localStorage.removeItem(STORAGE_KEY);
                    appData = getDefaultData();
                    saveData(appData);
                    showToast('Data reset to defaults.');
                    navigateTo('dashboard');
                }
            }
        }

        // ============ INITIALIZATION ============
        function init() {
            // Sidebar navigation
            document.querySelectorAll('#sidebarNav a').forEach(a => {
                a.addEventListener('click', function(e) {
                    e.preventDefault();
                    navigateTo(this.dataset.view);
                });
            });
            // Mobile toggle
            document.getElementById('mobileToggle').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('open');
            });
            // Close sidebar on main content click (mobile)
            document.getElementById('mainContent').addEventListener('click', function(e) {
                if (window.innerWidth <= 900 && !e.target.closest('.mobile-toggle') && !e.target.closest(
                        '#sidebar')) {
                    document.getElementById('sidebar').classList.remove('open');
                }
            });
            // Global search
            document.getElementById('globalSearch').addEventListener('input', function() {
                const q = this.value.toLowerCase().trim();
                if (q.length >= 2) {
                    if (currentView === 'guests') renderGuestsView(q);
                    else if (currentView === 'reservations') renderReservationsView(q);
                    else if (currentView === 'rooms') renderRoomsView(q);
                } else if (q.length === 0) {
                    navigateTo(currentView);
                }
            });
            // Render initial view
            navigateTo('dashboard');
            console.log('🏨 AMUD MOTEL COMMAND CENTER — 30-Room System Ready');
            console.log('📊 Dashboard | 🚪 Rooms | 📅 Reservations | 💳 Payments | 🧹 Housekeeping | 🔧 Maintenance');
            console.log('💾 Data stored in LocalStorage. Production should use Supabase/PostgreSQL.');
        }

        document.addEventListener('DOMContentLoaded', init);

        // Expose functions globally for inline onclick handlers
        window.navigateTo = navigateTo;
        window.openRoomDetail = openRoomDetail;
        window.changeRoomStatus = changeRoomStatus;
        window.reportMaintenance = reportMaintenance;
        window.checkInRoom = checkInRoom;
        window.checkOutRoom = checkOutRoom;
        window.reserveRoom = reserveRoom;
        window.checkInReservation = checkInReservation;
        window.checkOutReservation = checkOutReservation;
        window.viewReservation = viewReservation;
        window.createNewReservation = createNewReservation;
        window.showDayReservations = showDayReservations;
        window.addNewGuest = addNewGuest;
        window.viewGuest = viewGuest;
        window.walkInCheckIn = walkInCheckIn;
        window.recordPayment = recordPayment;
        window.createHKTask = createHKTask;
        window.startHKTask = startHKTask;
        window.completeHKTask = completeHKTask;
        window.openMaintenanceForm = openMaintenanceForm;
        window.assignMaint = assignMaint;
        window.resolveMaint = resolveMaint;
        window.addInventoryItem = addInventoryItem;
        window.addExpense = addExpense;
        window.addComplaint = addComplaint;
        window.addStaff = addStaff;
        window.saveSettings = saveSettings;
        window.resetAllData = resetAllData;
        window.exportCSV = exportCSV;
        window.closeModal = closeModal;
        console.log('✅ All systems initialized. 30 rooms. One system. Complete operational visibility.');
    </script>
</body>
</html>
